services:
  cockroachdb:
    image: cockroachdb/cockroach:latest-v23.2
    command: >
      start-single-node
      --insecure
      --store=attrs=ssd,path=/var/lib/cockroach/
    restart: unless-stopped
    volumes:
      - cockroach-tz-data:/var/lib/cockroach
    networks:
      - taaszan-internal
    healthcheck:
      test: ["CMD", "/cockroach/cockroach", "node", "status", "--insecure", "--host=localhost:26257"]
      interval: 10s
      timeout: 5s
      retries: 5

  nakama:
    image: heroiclabs/nakama:3.41.0
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address root@cockroachdb:26257/taaszan &&
        exec /nakama/nakama
        --name taaszan
        --database.address root@cockroachdb:26257/taaszan
        --logger.level INFO
        --session.token_expiry_sec 7200
        --socket.address 0.0.0.0
        --socket.port 7350
        --console.address 0.0.0.0
        --console.port 7361
        --console.username admin
        --console.password taaszan2025
        --runtime.path /nakama/modules
    restart: unless-stopped
    environment:
      - APP_PACKAGE_NAME=${APP_PACKAGE_NAME:-com.goodvillains.TasZan}
      - MYKET_PACKAGE_NAME=${MYKET_PACKAGE_NAME:-com.goodvillains.TasZan}
      - MYKET_ACCESS_TOKEN=${MYKET_ACCESS_TOKEN:-}
      - CAFEBAZAAR_PACKAGE_NAME=${CAFEBAZAAR_PACKAGE_NAME:-com.goodvillains.TasZan}
      - CAFEBAZAAR_PISHKHAN_API_SECRET=${CAFEBAZAAR_PISHKHAN_API_SECRET:-eyJhbGciOiJIUzI1NiIsImtpZCI6ImFuY2llbnQiLCJ0eXAiOiJKV1QifQ.eyJpc3MiOiJuYXNoZXItcGlzaGtoYW4tYXBpIiwiaWF0IjoxNzkwMDkyNzkxLCJleHAiOjQ5NDM2OTI3OTEsImFwaV9hZ2VudF9pZCI6OTQ3NX0.tw7wdMgTogBG6ydZ0NSdle-53slQ_O6g-EzWwGS4DWY}
    depends_on:
      cockroachdb:
        condition: service_healthy
    volumes:
      - ./modules:/nakama/modules
    networks:
      - taaszan-internal
    ports:
      - "7350:7350"
      - "7349:7349"
      - "7351:7361"
      - "7361:7361"

networks:
  taaszan-internal:
    driver: bridge

volumes:
  cockroach-tz-data: